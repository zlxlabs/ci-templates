# Normal pull-request Gate checks for this repository.
name: gate

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
    paths-ignore:
      - '**.md'
      - 'docs/**'

permissions:
  actions: read
  contents: read
  pull-requests: write

jobs:
  gate:
    uses: zlxlabs/gate/.github/workflows/gate-v2.yml@main
    with:
      tier: internal
      runner: self
      has_ui: false
    secrets:
      FEISHU_CI_WEBHOOK: ${{ secrets.FEISHU_CI_WEBHOOK }}
      # 透传 zlxlabs org 级 Silo 凭据（配合 gate 仓 Silo 迁移）
      SILO_ACCESS_KEY: ${{ secrets.SILO_ACCESS_KEY }}
      SILO_SECRET_KEY: ${{ secrets.SILO_SECRET_KEY }}
